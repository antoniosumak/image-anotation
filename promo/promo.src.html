<div id="frame">

    <defs><filter id="cs" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000" flood-opacity=".3"/></filter></defs>
    <path filter="url(#cs)" d="M4 3 L4 31 L11.2 24.4 L16 35.2 L20.6 33.2 L15.8 22.6 L25.4 22.6 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>

<script>
'use strict';
/* =========================================================================
 * Everything on screen is a pure function of t. seek(t) computes every style
 * from scratch: no transitions, no timers, nothing carried between frames.
 * ========================================================================= */
const T = 16;               // 8 bars at 120 BPM
const BEAT = 0.5;

/* ---------- springs: closed-form step responses ---------- */
function S(x, w, z) {
  if (x <= 0) return 0;
  const e = Math.exp(-z * w * x);
  if (z >= 1) return 1 - (1 + w * x) * e;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - e * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
/* Minimum-jerk reach: the profile a hand follows moving a pointer to a target,
 * slow to leave, quick through the middle, settling without overshoot. */
function reach(x) { if (x <= 0) return 0; if (x >= 1) return 1; return x * x * x * (10 - 15 * x + 6 * x * x); }
/* A value that changes target many times is the sum of one spring per change.
 * Each change also contributes from one loop earlier (t + T), so the value is
 * periodic in T and the last frame is the first.
 * evs: [[time, target, w?, z?, reachDuration?]] — a duration makes that change
 * a deliberate reach instead of a spring. */
function track(t, evs, w = 13, z = 0.86) {
  let prev = evs[evs.length - 1][1];
  let v = prev;
  for (const e of evs) {
    const d = e[1] - prev; prev = e[1];
    if (d === 0) continue;
    const ww = e[2] ?? w, zz = e[3] ?? z, dur = e[4];
    const step = dur ? x => reach(x / dur) : x => S(x, ww, zz);
    v += d * (step(t - e[0]) + step(t - e[0] + T) - 1);
  }
  return v;
}
/* vector version: evs [[time, [a,b,c..], w?, z?]] */
function trackV(t, evs, w, z) {
  const n = evs[0][1].length, out = [];
  for (let i = 0; i < n; i++) out.push(track(t, evs.map(e => [e[0], e[1][i], e[2], e[3], e[4]]), w, z));
  return out;
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = x => { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
const easeIO = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
/* enter over [a, a+da], exit over [b, b+db] */
const win = (t, a, da, b, db) => Math.min(easeOut((t - a) / da), 1 - easeIO((t - b) / db));
/* for layers whose window wraps across the loop point */
const wrap = (t, pivot) => (t < pivot ? t + T : t);

function css(el, o) { for (const k in o) el.style[k] = o[k]; }
function show(el, o, blur = 8, extra = '') {
  el.style.opacity = o;
  el.style.visibility = o <= 0.002 ? 'hidden' : 'visible';
  const b = (1 - o) * blur;
  el.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none';
}
function h(tag, cls, parent, html) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (html != null) el.innerHTML = html;
  if (parent) parent.appendChild(el);
  return el;
}
const box = (el, x, y, w, hh) => css(el, { left: x + 'px', top: y + 'px', width: w + 'px', height: hh + 'px' });

/* ---------- icons: lucide, one stroke width everywhere ---------- */
const ICON = (d, s = 28) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IMAGE_PLUS = '<path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/>';
const COMMAND = '<path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>';
const ENTER = '<polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/>';
const CLAUDE = s => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="currentColor"><path d="m3.127 10.604 3.135-1.76.053-.153-.053-.085H6.11l-.525-.032-1.791-.048-1.554-.065-1.505-.08-.38-.081L0 7.832l.036-.234.32-.214.455.04 1.009.069 1.513.105 1.097.064 1.626.17h.259l.036-.105-.089-.065-.068-.064-1.566-1.062-1.695-1.121-.887-.646-.48-.327-.243-.306-.104-.67.435-.48.585.04.15.04.593.456 1.267.981 1.654 1.218.242.202.097-.068.012-.049-.109-.181-.9-1.626-.96-1.655-.428-.686-.113-.411a2 2 0 0 1-.068-.484l.496-.674L4.446 0l.662.089.279.242.411.94.666 1.48 1.033 2.014.302.597.162.553.06.17h.105v-.097l.085-1.134.157-1.392.154-1.792.052-.504.25-.605.497-.327.387.186.319.456-.045.294-.19 1.23-.37 1.93-.243 1.29h.142l.161-.16.654-.868 1.097-1.372.484-.545.565-.601.363-.287h.686l.505.751-.226.775-.707.895-.585.759-.839 1.13-.524.904.048.072.125-.012 1.897-.403 1.024-.186 1.223-.21.553.258.06.263-.218.536-1.307.323-1.533.307-2.284.54-.028.02.032.04 1.029.098.44.024h1.077l2.005.15.525.346.315.424-.053.323-.807.411-3.631-.863-.872-.218h-.12v.073l.726.71 1.331 1.202 1.667 1.55.084.383-.214.302-.226-.032-1.464-1.101-.565-.497-1.28-1.077h-.084v.113l.295.432 1.557 2.34.08.718-.112.234-.404.141-.444-.08-.911-1.28-.94-1.44-.759-1.291-.093.053-.448 4.821-.21.246-.484.186-.403-.307-.214-.496.214-.98.258-1.28.21-1.016.19-1.263.112-.42-.008-.028-.092.012-.953 1.307-1.448 1.957-1.146 1.227-.274.109-.477-.247.045-.44.266-.39 1.586-2.018.956-1.25.617-.723-.004-.105h-.036l-4.212 2.736-.75.096-.324-.302.04-.496.154-.162 1.267-.871z"/></svg>`;

/* =========================================================================
 * Copy: the product's own words.
 * ========================================================================= */
const NOTES = [
  'Button should be 36px tall, not 44px',
  'Heading should be 28px bold, not 20px semibold',
  'Rows should be 56px, due date right-aligned',
];
const REPORT_PATH = '/Users/dev/northwind/reports/report-2026-09-25T10-14-02.png';
const PROMPT = [
  `Read the report image at ${REPORT_PATH}. It is a capture of this project's UI as currently built, with numbered regions drawn on it — each one marks somewhere the implementation diverges from its intended design, and carries the note written against it on a card beside its pin.`,
  'Work out which code produces each numbered region and change it so the implementation matches. Ask me before making a change I have not asked for.',
  'The implementation capture is on the left, and the design reference it should match is on the right. The numbered regions mark divergences on the implementation capture.',
  NOTES.map((n, i) => `${i + 1}. ${n}`).join('\n'),
].join('\n\n');
const SEND = ['Send to Claude Code', 'Sending…', 'Sent'];

/* =========================================================================
 * Timeline (seconds; one beat = 0.5 s)
 * ========================================================================= */
const TL = {
  cmdDown: 0.5, vDown: 1.0, paste: 1.0,
  drags: [ // mouse down, release, pin snap, card opens, typing starts
    { down: 2.0, up: 2.5, pin: 2.75, open: 3.0, type: 3.25 },
    { down: 4.75, up: 5.25, pin: 5.5, open: 5.75, type: 6.0 },
    { down: 7.5, up: 8.0, pin: 8.25, open: 8.5, type: 8.75 },
  ],
  cps: 34,
  // the last note is finished: the pointer travels to the toolbar's Send button,
  // settles on it, and presses it. Everything after follows from that press.
  toSend: 10.1, reach: 0.72, click: 11.0,
  design: 11.15, fold: 11.5, toButton: 12.1, sent: 12.5,
  terminal: 13.0, enter: 14.0, back: 14.5, fixes: [14.75, 15.0, 15.25], collapse: 15.5,
};

/* ---------- world geometry ---------- */
const F0 = [420, 550, 600, 340, 16];                 // the dashed drop target
const K1 = 0.72, K2 = 0.52;                          // capture scale: editing, report
const F1 = [40, 425, 1280 * K1, 820 * K1, 12];       // capture, beside the panel
const FC = [720 - 640 * K1, 425, 1280 * K1, 820 * K1, 12]; // capture, centred
const REP_W = 2584 * K2, REP_H = 820 * K2;
const FR1 = [48, 720 - REP_H / 2, 1280 * K2, REP_H, 10];
const FR2 = [48, 720 - REP_H / 2, REP_W, REP_H, 4];
const FT = [170, 380, 1100, 680, 14];
const PANEL = [990, 425, 410, 820 * K1];
const SEND_H = 44, SEND_Y = F1[1] - 14 - SEND_H;    // the toolbar above the capture
const SLOT = i => [PANEL[0] + 16, PANEL[1] + 60 + i * 134, 378, 122];

/* ---------- capture (native px) ---------- */
const PS = 40, CARD_GAP = 8;
const NAV = ['Overview', 'Revenue', 'Customers', 'Invoices', 'Products', 'Settings'];
const ROWS = [
  ['INV-2041', 'Halcyon Foods', '$12,400', '18 Aug 2026'],
  ['INV-2040', 'Peregrine Ltd', '$8,250', '17 Aug 2026'],
  ['INV-2039', 'Marlow & Sons', '$21,900', '15 Aug 2026'],
  ['INV-2038', 'Kestrel Design', '$4,120', '14 Aug 2026'],
  ['INV-2037', 'Ardent Systems', '$16,780', '12 Aug 2026'],
  ['INV-2036', 'Thornbury Co.', '$9,340', '11 Aug 2026'],
];
const STATS = [['Gross revenue', '$412,900', '+12.4%', '#16a34a'], ['Open invoices', '38', '−4.1%', '#dc2626'], ['Avg. days to pay', '21.5', '+2.0%', '#16a34a']];

/* One Northwind screen. apply(p) moves it from the implementation (0) to the
 * design (1), one divergence at a time. */
function northwind(parent) {
  const root = h('div', 'a cap', parent);
  h('div', 'a nw-side', root);
  h('div', 'a nw-logo', root);
  h('div', 'a nw-brand', root, 'Northwind');
  NAV.forEach((n, i) => { const e = h('div', 'a nw-nav' + (i === 1 ? ' on' : ''), root, n); e.style.top = 84 + i * 40 + 'px'; });
  h('div', 'a nw-top', root);
  h('div', 'a nw-search', root, 'Search invoices…');
  const btn = h('div', 'a nw-btn', root, 'New invoice');
  const head = h('div', 'a nw-h', root, 'Revenue overview');
  const sub = h('div', 'a nw-sub', root, 'Last 30 days compared with the previous period');
  STATS.forEach((s, i) => {
    const c = h('div', 'a nw-stat', root); c.style.left = 268 + i * 332 + 'px';
    h('div', 'a l', c, s[0]); h('div', 'a v', c, s[1]);
    const d = h('div', 'a d', c, s[2]); d.style.color = s[3];
  });
  const th = ['Invoice', 'Customer', 'Amount'].map((l, i) => { const e = h('div', 'a nw-th', root, l.toUpperCase()); e.style.left = [276, 420, 700][i] + 'px'; return e; });
  const thDue = h('div', 'a nw-th', root, 'DUE');
  const rule = h('div', 'a nw-rule', root); rule.style.top = '324px';
  const rows = ROWS.map((r, i) => {
    const tr = h('div', 'a nw-tr' + (i % 2 ? ' alt' : ''), root);
    const tds = r.map((c, j) => {
      const td = h('div', 'a nw-td', tr, c);
      td.style.left = [8, 152, 432, 632][j] + 'px';
      td.style.color = ['#0f172a', '#334155', '#0f172a', '#64748b'][j];
      if (j === 0) td.style.fontWeight = 500;
      return td;
    });
    return { tr, due: tds[3] };
  });
  let dueW = 0, thDueW = 0;
  const api = {
    root, head,
    measure() { dueW = rows[0].due.offsetWidth; thDueW = thDue.offsetWidth; },
    apply(p1, p2, p3) {
      // 1. button: 44px tall, flush to the edge -> 36px, inset like the design
      box(btn, lerp(1132, 1120, p1), lerp(10, 14, p1), lerp(140, 128, p1), lerp(44, 36, p1));
      // 2. heading: 20px semibold -> 28px bold
      const fs = lerp(20, 28, p2);
      css(head, { top: lerp(88, 84, p2) + 'px', fontSize: fs + 'px', fontWeight: Math.round(lerp(600, 700, p2)), lineHeight: fs * 1.3 + 'px' });
      sub.style.top = lerp(88, 84, p2) + fs * 1.3 + 4 + 'px';
      // 3. rows: 44px -> 56px, due date left -> right aligned
      const rh = lerp(44, 56, p3);
      rows.forEach((r, i) => {
        css(r.tr, { top: 324 + i * rh + 'px', height: rh + 'px' });
        r.due.style.left = lerp(632, 972 - dueW, p3) + 'px';
      });
      thDue.style.left = lerp(900, 1240 - thDueW, p3) + 'px';
    },
  };
  return api;
}

/* ---------- build ---------- */
const world = document.getElementById('world');
const cursorEl = document.getElementById('cursor');

/* ---------- measured constants (fonts must be loaded) ---------- */
let M = null;
function measure() {
  cap.measure(); des.measure();
  cap.apply(0, 0, 0);
  const hw = cap.head.offsetWidth;
  REG[1].b = [262 + hw + 14, 118];
  const cards = regionEls.map(r => ({ w: r.card.offsetWidth, h: r.card.offsetHeight }));
  const labelW = btnLabels.map(l => l.offsetWidth);
  const btnW = labelW.map(w => Math.round(26 + 22 + 12 + w + 26));
  const inputH = input.offsetHeight;
  // pins and cards, placed the way the product places them (region-style.ts)
  const place = REG.map((r, i) => {
    const [x0, y0] = r.a, [x1, y1] = r.b;
    const above = r.tip === 'bottom-left';
    const pin = [x0, above ? y0 - PS : y1, PS, PS];
    const c = cards[i];
    const right = pin[0] + PS + CARD_GAP;
    const fits = right + c.w <= 1280;
    const cx = fits ? right : pin[0] - CARD_GAP - c.w;
    const cy = above ? pin[1] + PS - c.h : pin[1];
    return { region: [x0, y0, x1 - x0, y1 - y0], pin, card: [clamp(cx, 0, 1280 - c.w), clamp(cy, 0, 820 - c.h), c.w, c.h] };
  });
  M = { place, btnW, labelW, inputH, headW: pHead.offsetWidth, send: [F1[0], SEND_Y, sendBtn.offsetWidth, SEND_H] };
  des.apply(1, 1, 1);
  window.READY = true;
}

/* ---------- cursor path (world px) ---------- */
function toWorld(p, k = K1, g = F1) { return [g[0] + p[0] * k, g[1] + p[1] * k]; }
function cursorEvents() {
  const r = M.place.map(p => ({ a: toWorld([p.region[0], p.region[1]]), b: toWorld([p.region[0] + p.region[2], p.region[1] + p.region[3]]) }));
  const P0 = [1010, 1000];
  // aim a little left of the label's middle, where a hand lands on a button
  const [sx, sy, sw, sh] = M.send;
  const onSend = [sx + sw * 0.42, sy + sh * 0.55];
  const ev = [
    [1.45, r[0].a],
    [TL.drags[0].down, r[0].b, 21, 12.5],   // x leads, y trails: the leading edge runs ahead
    [3.3, r[1].a],
    [TL.drags[1].down, r[1].b, 21, 12.5],
    [6.1, r[2].a],
    [TL.drags[2].down, r[2].b, 17, 10.5],
    [TL.toSend, onSend, null, null, TL.reach],
    [11.4, [600, 1030]],
    [13.4, [735, 1124]],
    [14.35, P0],
  ];
  return ev;
}
let CUR = null;
function cursorAt(t) {
  // on a reach, y sets off a moment after x, so the path bows like a wrist's
  const xs = CUR.map(e => [e[0], e[1][0], e[2] ?? 10, e[2] ? 0.94 : 1, e[4]]);
  const ys = CUR.map(e => [e[0] + (e[4] ? 0.06 : 0), e[1][1], e[3] ?? 10, e[3] ? 0.94 : 1, e[4]]);
  return [track(t, xs), track(t, ys)];
}
function pressAt(t) {
  const holds = [...TL.drags.map(d => [d.down, d.up]), [TL.click, TL.click + 0.1], [TL.enter, TL.enter + 0.12], [TL.cmdDown - 0.02, TL.cmdDown + 0.62]];
  let p = 0;
  for (const [a, b] of holds.slice(0, 5)) p = Math.max(p, Math.min(easeOut((t - a) / 0.05), 1 - easeOut((t - b) / 0.07)));
  return p;
}

/* ---------- camera ---------- */
const CAM = [
  [TL.paste, [720, 720, Math.log(1.0)]],
  [1.6, [880, 545, Math.log(1.85)]],
  [3.0, [1130, 610, Math.log(1.55)]],
  [4.25, [420, 560, Math.log(1.85)]],
  [5.75, [1130, 690, Math.log(1.55)]],
  [7.0, [600, 690, Math.log(1.42)]],
  [8.5, [1130, 770, Math.log(1.55)]],
  // pull back to the whole app on the same reach as the pointer, so on screen
  // it travels one way to the button; then hold still for the press
  [TL.toSend, [720, 720, Math.log(1.0)], null, null, TL.reach],
  [TL.fold + 0.15, [381, 720, Math.log(1.95)]],
  [TL.toButton, [720, 720, Math.log(2.0)]],
  [13.0, [720, 730, Math.log(1.14)]],
  [14.5, [720, 720, Math.log(1.3)]],
  [TL.collapse, [720, 720, Math.log(1.55)]],
];

/* ---------- the one shape ---------- */
function heroEvents() {
  const bw = M.btnW, B = w => [720 - w / 2, 690, w, 60, 12];
  return [
    // already pressed in the toolbar, so the report arrives as the button mid-send
    [TL.paste, F1], [TL.design, FR1], [TL.fold, FR2], [TL.toButton, B(bw[1])],
    [TL.sent + 0.06, B(bw[2])],
    [TL.terminal, FT], [TL.back, FC], [TL.collapse, F0],
  ];
}
// colour: bg rgba, border rgb, border alpha, dash alpha, shadow
const WHITE = [255, 255, 255, 1];
const HCOL = [
  [TL.paste, [...WHITE, 229, 229, 229, 1, 0, 1]],
  [TL.fold, [...WHITE, 229, 229, 229, 1, 0, 1.5]],
  [TL.toButton, [217, 119, 87, 1, 229, 229, 229, 0, 0, 0.6]],
  [TL.terminal, [23, 23, 23, 1, 48, 48, 48, 1, 0, 1.6], 60, 1],
  [TL.back, [...WHITE, 229, 229, 229, 1, 0, 1], 50, 1],
  [TL.collapse, [255, 255, 255, 0.4, 229, 229, 229, 0, 1, 0]],
];

let HEV = null;
function heroAt(t) { return trackV(t, HEV, 13, 0.86); }
function kAt(t, H) {
  let k = track(t, [[TL.design, K2], [TL.back - 0.1, K1]], 13, 0.86);
  if (t >= TL.toButton && t < TL.terminal) k = K2 * Math.min(1, H[2] / REP_W);
  return k;
}

/* ---------- seek ---------- */
function seek(tIn) {
  const t = ((tIn % T) + T) % T;

  /* camera */
  const [cx, cy, lz] = trackV(t, CAM, 10, 1);
  const z = Math.exp(lz);
  world.style.transform = `translate(${(720 - cx * z).toFixed(3)}px, ${(720 - cy * z).toFixed(3)}px) scale(${z.toFixed(5)})`;
  const toScreen = (x, y) => [(x - cx) * z + 720, (y - cy) * z + 720];

  /* hero geometry + colour */
  const H = heroAt(t);
  const [hx, hy, hw, hh] = H;
  box(hero, hx, hy, hw, hh);
  const C = trackV(t, HCOL, 18, 1);
  const r = Math.max(0, H[4]);
  css(hero, {
    borderRadius: r + 'px',
    background: `rgba(${C[0] | 0},${C[1] | 0},${C[2] | 0},${clamp(C[3], 0, 1).toFixed(3)})`,
    boxShadow: C[9] > 0.01 ? `0 ${2 * C[9]}px ${4 * C[9]}px rgba(0,0,0,${0.03 * C[9]}), 0 ${14 * C[9]}px ${36 * C[9]}px -${10 * C[9]}px rgba(15,23,42,${0.2 * Math.min(C[9], 1.6)})` : 'none',
  });
  heroBorder.setAttribute('width', hw); heroBorder.setAttribute('height', hh);
  const bs = heroBorder.querySelector('#bSolid'), bd = heroBorder.querySelector('#bDash');
  for (const [el, inset] of [[bs, 0.5], [bd, 0.75]]) {
    el.setAttribute('x', inset); el.setAttribute('y', inset);
    el.setAttribute('width', Math.max(0, hw - 2 * inset)); el.setAttribute('height', Math.max(0, hh - 2 * inset));
    el.setAttribute('rx', Math.max(0, r - inset));
  }
  bs.setAttribute('stroke', `rgb(${C[4] | 0},${C[5] | 0},${C[6] | 0})`);
  bs.setAttribute('stroke-opacity', clamp(C[7], 0, 1));
  bd.setAttribute('stroke-opacity', clamp(C[8], 0, 1));

  /* content that swaps inside the one shape: each with its own enter and exit */
  const tw = wrap(t, 8);
  show(drop, win(tw, TL.collapse + 0.12, 0.26, T + TL.paste, 0.1), 10);
  css(drop, { left: (hw - 600) / 2 + 'px', top: (hh - 340) / 2 + 'px' });

  // capture
  const k = kAt(t, H);
  const ax = t >= TL.fold - 0.05 && t < TL.terminal ? 0 : 0.5;
  const capL = (hw - 1280 * k) * ax, capT = (hh - 820 * k) / 2;
  css(capWrap, { transform: `translate(${capL}px, ${capT}px) scale(${k})` });
  const capO = Math.max(win(t, TL.paste + 0.06, 0.26, TL.toButton, 0.12), win(t, TL.back + 0.06, 0.22, TL.collapse, 0.12));
  show(capWrap, capO, 10);
  // the capture re-renders to match the design, one divergence at a time
  const fixP = TL.fixes.map(f => track(t, [[f, 1, 16, 0.9], [TL.collapse + 0.25, 0, 30, 1]]));
  cap.apply(...fixP);
  band.style.opacity = easeOut((t - TL.fold) / 0.2) * (t < TL.terminal ? 1 : 0);

  // regions, handles, pins, report cards
  const cursorW = cursorAt(t);
  const pr = pressAt(t);
  M.place.forEach((p, i) => {
    const d = TL.drags[i], R = regionEls[i];
    const [x0, y0, w0, h0] = p.region;
    let x1 = x0 + w0, y1 = y0 + h0;
    // direct manipulation: while held, the far corner is the pointer
    const toCap = ([wx, wy]) => [(wx - F1[0]) / K1, (wy - F1[1]) / K1];
    if (t >= d.down && t < d.up) {
      [x1, y1] = toCap(cursorW);
    } else if (t >= d.up) {
      const [rx, ry] = toCap(cursorAt(d.up));
      const s = S(t - d.up, 22, 0.8);
      x1 = lerp(rx, x1, s); y1 = lerp(ry, y1, s);
    }
    const alive = t >= d.down;
    const dissolve = 1 - easeIO((t - TL.fixes[i]) / 0.3);
    const regO = alive ? Math.min(easeOut((t - d.down) / 0.04), dissolve) : 0;
    const ex = Math.min(x0, x1), ey = Math.min(y0, y1), ew = Math.abs(x1 - x0), eh = Math.abs(y1 - y0);
    box(R.el, ex - 1.5, ey - 1.5, ew + 3, eh + 3);
    show(R.el, regO * (t >= TL.back || t < TL.toButton + 0.2 ? 1 : 0), 6);
    // handles: after release, gone from the report image
    const hO = Math.min(easeOut((t - d.up) / 0.12), 1 - easeIO((t - TL.fold) / 0.12)) * (t < TL.back ? 1 : 0);
    const hs = [0, 0.5, 1].flatMap(a => [0, 0.5, 1].map(b => [a, b])).filter(([a, b]) => !(a === 0.5 && b === 0.5));
    hs.forEach(([a, b], j) => {
      const e = R.hs[j];
      css(e, { left: ex + ew * a + 'px', top: ey + eh * b + 'px', transform: `scale(${S(t - d.up - j * 0.012, 30, 0.8)})` });
      show(e, hO, 0);
    });
    // pin: pushed out of the region's corner, squared corner touching it
    const [px, py] = p.pin;
    const above = REG[i].tip === 'bottom-left';
    const ps = S(t - d.pin, 26, 0.72);
    css(R.pin, {
      left: px + 'px', top: py + 'px',
      borderRadius: above ? '20px 20px 20px 0' : '0 20px 20px 20px',
      transformOrigin: above ? '0 100%' : '0 0',
      transform: `scale(${Math.max(0, ps)})`,
    });
    show(R.pin, t >= d.pin ? dissolve : 0, 4);
    // report card: grows away from the region, never across it
    const [qx, qy, qw, qh] = p.card;
    const leftOfPin = qx < px;
    const ct = TL.fold + 0.06 + i * 0.07;
    const cs = S(t - ct, 22, 0.8);
    css(R.card, {
      left: qx + 'px', top: qy + 'px',
      transformOrigin: `${leftOfPin ? '100%' : '0'} ${above ? '100%' : '0'}`,
      transform: `scale(${lerp(0.5, 1, cs)})`,
    });
    show(R.card, win(t, ct, 0.18, TL.toButton, 0.1), 6);
  });

  // send button
  const bO = win(t, TL.toButton + 0.1, 0.2, TL.terminal, 0.1);
  show(btnC, bO, 8);
  const labelO = [
    0,
    win(t, TL.toButton + 0.1, 0.2, TL.sent - 0.02, 0.08),
    win(t, TL.sent + 0.08, 0.14, TL.terminal, 0.1),
  ];
  const lw = labelO.reduce((s, o, i) => s + o * M.labelW[i], 0) / Math.max(0.001, labelO.reduce((s, o) => s + o, 0));
  const groupW = 22 + 12 + lw;
  const gx = (hw - groupW) / 2;
  css(btnMark, { left: gx + 'px', top: (hh - 22) / 2 + 'px' });
  btnLabels.forEach((l, i) => { css(l, { left: gx + 34 + 'px', top: (hh - 28) / 2 + 'px', lineHeight: '28px' }); show(l, labelO[i], 6); });

  // terminal: the prompt is already typed in; it waits on Enter
  show(term, win(t, TL.terminal + 0.14, 0.24, TL.back, 0.1), 10);
  const inputTop = 70 + 176;
  css(input, { top: inputTop + 'px' });
  css(hint, { top: inputTop + M.inputH + 12 + 'px' });
  const blinkOn = ((t - TL.terminal) % BEAT) < BEAT * 0.55 || t < TL.terminal + 0.4;
  const sentToAgent = t >= TL.enter;
  tcaret.style.opacity = sentToAgent ? 0 : blinkOn ? 1 : 0;
  inputText.style.color = sentToAgent ? '#a3a3a3' : '#e5e5e5';
  input.style.borderColor = sentToAgent ? '#737373' : '#525252';

  /* design reference: slides in beside the capture, then docks into the report */
  let D;
  if (t >= TL.toButton && t < TL.terminal) {
    D = [H[0] + H[2] * (1304 / 2584), H[1] + (H[3] - 820 * k) / 2, H[2] * (1280 / 2584), 820 * k];
  } else {
    const dx = lerp(738 + 260, 738, S(t - TL.design - 0.04, 12, 0.9));
    const dock = S(t - TL.fold, 13, 0.86);
    D = [lerp(dx, 48 + 1304 * K2, dock), 720 - REP_H / 2, 1280 * K2, REP_H];
  }
  box(design, ...D);
  const dk = t >= TL.toButton ? 1 : S(t - TL.fold, 13, 0.86);
  css(design, {
    borderRadius: lerp(10, 0, clamp(dk, 0, 1)) + 'px',
    boxShadow: `0 0 0 1px rgba(229,229,229,${1 - clamp(dk, 0, 1)}), 0 14px 36px -10px rgba(15,23,42,${0.2 * (1 - clamp(dk, 0, 1))})`,
  });
  css(designCapWrap, { transform: `scale(${D[2] / 1280})` });
  show(design, win(t, TL.design + 0.05, 0.22, TL.toButton, 0.12), 10);
  box(designLabel, 738 - 0, 720 - REP_H / 2 - 36, 300, 22);
  show(designLabel, win(t, TL.design + 0.12, 0.2, TL.fold, 0.1), 6);

  /* toolbar Send button: hover follows the pointer, the press is the click */
  {
    const [bx, by, bw, bh] = M.send;
    const inside = ([x, y]) => x >= bx && x <= bx + bw && y >= by && y <= by + bh;
    // a hover fades in over ~120ms: the share of that window the pointer was on it
    let hov = 0;
    for (let j = 0; j < 8; j++) hov += inside(cursorAt(t - (j / 7) * 0.12)) ? 1 / 8 : 0;
    hov = easeIO(hov);
    const prs = Math.min(easeOut((t - TL.click) / 0.04), 1 - easeOut((t - TL.click - 0.1) / 0.12));
    const col = [[217, 119, 87], [207, 108, 75], [201, 100, 66]];
    const mix = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
    const c = mix(mix(col[0], col[1], hov), col[2], Math.max(0, prs));
    box(sendBtn, bx, by, bw, bh);
    css(sendBtn, {
      background: `rgb(${c.map(v => v | 0).join(',')})`,
      boxShadow: `0 1px 2px rgba(0,0,0,.08), 0 ${4 + 2 * hov}px ${12 + 4 * hov}px -4px rgba(217,119,87,${0.35 + 0.15 * hov - 0.2 * Math.max(0, prs)})`,
      transform: `scale(${1 - 0.03 * Math.max(0, prs)})`,
    });
    show(sendBtn, win(t, TL.paste + 0.22, 0.28, TL.design, 0.14), 8);
  }

  /* divergences panel */
  const pO = win(t, TL.paste + 0.22, 0.28, TL.design, 0.14);
  const pShift = (1 - S(t - TL.paste - 0.2, 12, 0.9)) * 40 + (t > TL.design ? easeIO((t - TL.design) / 0.2) * 60 : 0);
  box(panel, PANEL[0] + pShift, PANEL[1], PANEL[2], PANEL[3]);
  show(panel, pO, 8);
  const count = TL.drags.filter(d => t >= d.pin).length;
  const headW = M.headW;
  badges.forEach((b, i) => {
    css(b, { left: 18 + headW + 'px', top: '19px' });
    const d = TL.drags[i], next = TL.drags[i + 1];
    show(b, win(t, d.pin + 0.04, 0.14, next ? next.pin : 99, 0.06), 5);
  });
  show(empty, 1 - easeIO((t - TL.drags[0].open) / 0.12), 5);

  /* note cards: the pin opens into the card */
  ncards.forEach((n, i) => {
    const d = TL.drags[i], p = M.place[i];
    const pinW = toWorld([p.pin[0], p.pin[1]]);
    const from = [pinW[0], pinW[1], PS * K1, PS * K1];
    const to = SLOT(i);
    const s = S(t - d.open, 12, 0.86);
    const g = from.map((v, j) => lerp(v, to[j], s));
    box(n.c, g[0] + pShift, g[1], g[2], g[3]);
    const above = REG[i].tip === 'bottom-left';
    const half = PS * K1 / 2;
    const radii = (above ? [half, half, half, 0] : [0, half, half, half]).map(rr => lerp(rr, 10, clamp(s, 0, 1)));
    const col = clamp(easeOut((t - d.open) / 0.2), 0, 1);
    css(n.c, {
      borderRadius: radii.map(rr => rr + 'px').join(' '),
      background: `rgb(${lerp(225, 255, col) | 0},${lerp(29, 255, col) | 0},${lerp(72, 255, col) | 0})`,
      boxShadow: `0 0 0 1px rgba(229,229,229,${col})`,
    });
    const alive = t >= d.open;
    show(n.c, alive ? pO : 0, 8);
    show(n.disc, win(t, d.open + 0.12, 0.16, 99, 1), 4);
    const typed = Math.floor(clamp((t - d.type) * TL.cps, 0, NOTES[i].length));
    const focused = t >= d.open + 0.1 && t < (TL.drags[i + 1]?.open ?? TL.click);
    const caretOn = focused && (typed < NOTES[i].length || ((t - d.type) % BEAT) < BEAT * 0.55);
    n.txt.innerHTML = (typed ? escapeHtml(NOTES[i].slice(0, typed)) : '') + (caretOn ? '<span class="caret"></span>' : '') + (typed ? '' : '<span class="ph">What is wrong here?</span>');
    show(n.txt, win(t, d.open + 0.16, 0.18, 99, 1), 5);
  });

  /* keycaps */
  const keyPress = (t0, t1) => Math.min(easeOut((t - t0) / 0.035), 1 - easeOut((t - t1) / 0.06));
  const kv = [[keyCmd, 629, TL.cmdDown, TL.vDown + 0.12], [keyV, 727, TL.vDown, TL.vDown + 0.12]];
  const kO = win(wrap(t, 8), T - 0.0 + 0.05, 0.2, T + TL.vDown + 0.14, 0.14);
  kv.forEach(([el, x, a, b]) => {
    const p = keyPress(a, b);
    box(el, x, 915 + 3 * p + (1 - kO) * 12, 84, 84);
    css(el, { borderBottomWidth: 4 - 3 * p + 'px', background: p > 0.5 ? '#f5f5f5' : '#fff' });
    show(el, kO, 6);
  });
  const eO = win(t, TL.terminal + 0.4, 0.2, TL.back, 0.12);
  const ep = keyPress(TL.enter, TL.enter + 0.12);
  box(keyEnter, 645, 1084 + 3 * ep + (1 - eO) * 12, 150, 72);
  css(keyEnter, { borderBottomWidth: 4 - 3 * ep + 'px', background: ep > 0.5 ? '#f5f5f5' : '#fff' });
  show(keyEnter, eO, 6);

  /* cursor */
  const [sx, sy] = toScreen(cursorW[0], cursorW[1]);
  cursorEl.style.transform = `translate(${(sx - 4).toFixed(2)}px, ${(sy - 3).toFixed(2)}px) scale(${1 - 0.12 * pr})`;
}
function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

/* ---------- UI sounds, for the mixer ---------- */
function sounds() {
  const s = [
    { t: TL.cmdDown, type: 'key', gain: 0.9 },
    { t: TL.vDown, type: 'key', gain: 0.9 },
    { t: TL.paste + 0.01, type: 'paste', gain: 1 },
  ];
  TL.drags.forEach((d, i) => {
    s.push({ t: d.down, type: 'dragstart', gain: 0.9 }, { t: d.up, type: 'release', gain: 0.7 }, { t: d.pin, type: 'pin', gain: 1 });
    for (let c = 0; c < NOTES[i].length; c++) s.push({ t: d.type + c / TL.cps, type: 'tap', gain: 0.55, seed: i * 100 + c });
  });
  s.push({ t: TL.design, type: 'whoosh', gain: 0.6 }, { t: TL.fold, type: 'fold', gain: 0.8 },
    { t: TL.toButton, type: 'whoosh', gain: 0.45 }, { t: TL.click, type: 'click', gain: 1 },
    { t: TL.sent, type: 'sent', gain: 0.7 }, { t: TL.terminal, type: 'whoosh', gain: 0.5 },
    { t: TL.enter, type: 'enter', gain: 1 }, { t: TL.back, type: 'whoosh', gain: 0.45 });
  TL.fixes.forEach((f, i) => s.push({ t: f, type: 'dissolve', gain: 0.7, seed: i }));
  s.push({ t: TL.collapse, type: 'fold', gain: 0.6 });
  return s;
}

document.fonts.ready.then(() => {
  measure();
  HEV = heroEvents();
  CUR = cursorEvents();
  window.SOUNDS = sounds();
  window.seek = seek;
  seek(0);
});
</script>
